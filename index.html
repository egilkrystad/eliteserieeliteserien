h1{

input{

#teams{

<body>


<div id="loginBox">
	<h1>Eliteserieeliteserien 2027</h1>

	
	<form onsubmit="login(); return false;">

    <input
        id="email"
        type="email"
        placeholder="E-post"
        autocomplete="email">

    <input
        id="password"
        type="password"
        placeholder="Passord"
        autocomplete="current-password">

    <button type="submit">
        Logg inn

	<p>

       onclick="forgotPassword()">
       Glemt passord?
    </a>
</p>
	<button type="button" onclick="showRegister()">

	</button>


</form>


</div>

<div id="registerBox" style="display:none;">

        id="registerEmail"
        type="email"

        id="registerPassword"
        type="password"
        placeholder="Passord">

        id="inviteCode"
        placeholder="Invitasjonskode">

    <button onclick="registerUser()">
        Registrer

    <button onclick="showLogin()">
        Tilbake

</div>




<div id="app" style="display:none;">

    <h1>Eliteserietips 2027</h1>

    <input
        id="first_name"
        placeholder="Fornavn"
    >

    <input
        id="last_name"
        placeholder="Etternavn"

    id="phone"
    placeholder="Mobilnummer">



<ul id="teams">

    <li>KFUM</li>

    <li>Lillestrøm</li>
    <li>Vålerenga</li>
    <li>Aalesund</li>
    <li>Start</li>
</ul>

    <button onclick="savePrediction()">
        Lagre tips
    </button>
	
	<button
    id="showTipsButton"
    style="display:none;"
    onclick="window.location.href='tips.html'">
    Se alle tips

    Logg ut
</button>
</div>



<script>

const SUPABASE_URL =
    "https://ilgdmxamhoawloquxfes.supabase.co";
	
const supabaseClient = window.supabase.createClient(
    "https://ilgdmxamhoawloquxfes.supabase.co",
    "sb_publishable_gYJ_YjEozpUk65ACQ84GEQ_QX_vbmrb"
);

const SUPABASE_KEY =
    "sb_publishable_gYJ_YjEozpUk65ACQ84GEQ_QX_vbmrb";

new Sortable(
    document.getElementById("teams"),
    {
        animation: 150
    }
);

async function login() {
	
    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    console.log("LOGIN", data, error);

    if (error) {

        alert(error.message);

    } else {

		startAutoLogout();
        await checkUser();
    }
}
function showRegister() {

    document.getElementById("loginBox")
        .style.display = "none";

    document.getElementById("registerBox")
        .style.display = "block";
}

function showLogin() {

    document.getElementById("registerBox")
        .style.display = "none";

    document.getElementById("loginBox")
        .style.display = "block";
}

async function forgotPassword() {

    const email =
        document.getElementById("email")
            .value
            .trim();

    if (!email) {

        alert(
            "Skriv inn e-postadressen først."
        );

        return;
    }

    const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
                redirectTo:
                "https://eliteserieeliteserien.no/reset.html"
            }
        );

    if (error) {

        alert(error.message);

    } else {

        alert(
            "E-post med lenke for nytt passord er sendt."
        );
    }
}
const INVITE_CODE = "ELITE2027";
async function registerUser() {

    const email =
        document.getElementById("registerEmail")
            .value.trim();

    const password =
        document.getElementById("registerPassword")
            .value;

    const inviteCode =
        document.getElementById("inviteCode")
            .value.trim();

    console.log({
        email,
        password,
        inviteCode
    });

    if (inviteCode !== INVITE_CODE) {

        alert("Ugyldig invitasjonskode");
        return;
    }

    const { data, error } =
		await supabaseClient.auth.signUp({
			email,
			password
		});

	console.log(
		"EMAIL:",
		email
	);

	console.log(
		"DATA:",
		JSON.stringify(data, null, 2)
	);

	console.log(
		"ERROR:",
		error
	);

    if (error) {

    alert(error.message);

} else {

    console.log("DATA", data);

    if (data.session) {

        alert(
            "Brukeren er registrert og innlogget."
        );

        await checkUser();

    } else {

        alert(
            "Brukeren er registrert. Du kan nå logge inn."
        );

        showLogin();

        document.getElementById("email").value =
            email;

        document.getElementById("password").focus();
    }
}

async function savePrediction() {
	const {
		data: { session }
	} = await supabaseClient.auth.getSession();

	if (!session) {
		alert("Du må være innlogget");
		return;
	}

    const firstName =
    document.getElementById("first_name")
    .value.trim();

	const lastName =
		document.getElementById("last_name")
		.value.trim();
		
	const phone =
		document.getElementById("phone")
		.value.trim();

	if (!firstName || !lastName || !phone) {
		alert("Skriv inn fornavn, etternavn og telefonnummer");
		return;
	}

	if (!/^[49][0-9]{7}$/.test(phone)) {
		alert(
			"Må være et gyldig mobilnummer."
		);
		return;
	}



    const teams =
        [...document.querySelectorAll("#teams li")]
        .map(li => li.textContent);

	const {
		data: { user }
	} = await supabaseClient.auth.getUser();
	
	console.log({firstName,lastName,phone});

	const { error } = await supabaseClient
		
		.from("predictions")
		.insert([
			{
				user_id: user.id,
				first_name: firstName,
				last_name: lastName,
				phone: phone,
				prediction: teams
			}
		]);


	if (error) {

		if (error.code === "23505") {

			alert("Telefonnummeret er allerede registrert");

		} else {

			alert(error.message);
		}
	}
 else {

		alert("Tipset er lagret!");

		document.getElementById("showTipsButton")
			.style.display = "inline-block";
	}

    

}

checkUser();

async function checkUser() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        document.getElementById("loginBox")
            .style.display = "block";

        document.getElementById("app")
            .style.display = "none";

        return;
    }

    const {
		data: { user },
		error
	} = await supabaseClient.auth.getUser();

	if (error || !user) {

		document.getElementById("loginBox")
			.style.display = "block";

		document.getElementById("app")
			.style.display = "none";

		return;
	}

    document.getElementById("loginBox")
        .style.display = "none";

    document.getElementById("app")
        .style.display = "block";
}

async function logout() {
    await supabaseClient.auth.signOut();
    location.reload();
}

async function checkIfSubmitted() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) return;

    const { data } = await supabaseClient
        .from("predictions")
        .select("*")
        .eq("user_id", user.id)
        .limit(1);

    if (data && data.length > 0) {

        document.getElementById("showTipsButton")
            .style.display = "inline-block";
    }
}

const AUTO_LOGOUT_MINUTES = 60;

function startAutoLogout() {
    const expiresAt =
        Date.now() + AUTO_LOGOUT_MINUTES * 60 * 1000;

    localStorage.setItem(
        "sessionExpiresAt",
        expiresAt
    );

    setTimeout(forceLogout, AUTO_LOGOUT_MINUTES * 60 * 1000);
}

async function forceLogout() {
    await supabaseClient.auth.signOut();

    localStorage.removeItem("sessionExpiresAt");

    window.location.href = "index.html";
	alert("Logget ut av Elite pga tidsgrense ("+AUTO_LOGOUT_MINUTES+" min)");
}

function checkAutoLogout() {
    const expiresAt =
        localStorage.getItem("sessionExpiresAt");

    if (!expiresAt) return;

    const remaining =
        Number(expiresAt) - Date.now();

    if (remaining <= 0) {
        forceLogout();
        return;
    }

    setTimeout(forceLogout, remaining);
}
checkAutoLogout();

</script>

</body>
